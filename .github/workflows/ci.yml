name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  ci-gate:
    name: CI
    needs: quality
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality matrix leg to pass
        run: |
          if [ "${{ needs.quality.result }}" != "success" ]; then
            echo "One or more quality matrix jobs failed or were cancelled."
            exit 1
          fi
