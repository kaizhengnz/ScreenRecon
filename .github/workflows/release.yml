name: Release to PyPI

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version segment to bump (default: patch. minor/major means you are consciously bumping the 0.1 prefix.)"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

jobs:
  bump-and-tag:
    name: Bump version and tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bump __version__
        id: bump
        run: python scripts/bump_version.py ${{ inputs.bump }}
      - name: Commit, tag, push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screenrecon/__init__.py
          git commit -m "chore: release v${{ steps.bump.outputs.new_version }}"
          git tag "v${{ steps.bump.outputs.new_version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.new_version }}"

  test:
    name: Run tests
    needs: bump-and-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "v${{ needs.bump-and-tag.outputs.new_version }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project with dev extras
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: pytest
        run: pytest

  build:
    name: Build distributions
    needs: [bump-and-tag, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "v${{ needs.bump-and-tag.outputs.new_version }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build
        run: python -m pip install --upgrade build
      - name: Build sdist and wheel
        run: python -m build
      - name: Validate with twine
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - name: Upload distributions as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [bump-and-tag, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/screenrecon/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish via trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
