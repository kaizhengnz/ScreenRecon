name: Release

on:
  push:
    branches: [main]
  # Manual escape hatch: run against `main` (or any ref) when the chain from
  # release_pr.yml did not fire — e.g. when the merge push was suppressed by
  # GitHub's GITHUB_TOKEN anti-recursion rule.
  workflow_dispatch:

jobs:
  detect-release:
    name: Detect release commit
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: 'Match "chore: release vX.Y.Z" on the head commit'
        id: check
        run: |
          MSG=$(git log -1 --format=%s)
          echo "head commit subject: $MSG"
          if [[ "$MSG" =~ ^chore:\ release\ v([0-9]+\.[0-9]+\.[0-9]+)(\ .*)?$ ]]; then
            echo "is_release=true"        >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Run tests
    needs: detect-release
    if: needs.detect-release.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project with dev extras
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: pytest
        run: pytest

  build:
    name: Build distributions
    needs: [detect-release, test]
    if: needs.detect-release.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build
        run: python -m pip install --upgrade build
      - name: Build sdist and wheel
        run: python -m build
      - name: Validate with twine
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - name: Upload distributions as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  tag:
    name: Tag release commit
    needs: [detect-release, test, build]
    if: needs.detect-release.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create and push tag
        env:
          NEW_VERSION: ${{ needs.detect-release.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${NEW_VERSION}"
          git push origin "v${NEW_VERSION}"

  publish:
    name: Publish to PyPI
    needs: [detect-release, tag]
    if: needs.detect-release.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/screenrecon/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish via trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
