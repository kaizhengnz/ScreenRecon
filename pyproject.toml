[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "screenrecon"
dynamic = ["version"]
description = "Watch a screen region; when the mouse dwells there, recognise it with AI and push the result to Telegram."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
# Apache-2.0 section 4(d) requires NOTICE to travel with redistributions.
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "kaizhengnz", email = "kaizhengnz@gmail.com" }]
keywords = ["screenshot", "vision", "ocr", "telegram", "automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
    "Topic :: Utilities",
]
dependencies = [
    # mss.mss is deprecated in 10 and removed in 11; capture.py prefers mss.MSS
    # where available, but cap the major version until 11 is verified.
    "mss>=9.0,<11",
    "pillow>=10.0",
    # 'output_config' must exist on messages.create(); 0.104 is the verified floor.
    "anthropic>=0.104",
    "requests>=2.31",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "python-xlib>=0.33; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # Imported directly by tests/test_vision.py to build real SDK exceptions.
    "httpx>=0.27",
]

[project.scripts]
screenrecon = "screenrecon.cli:main"

[project.urls]
Homepage = "https://github.com/kaizhengnz/ScreenRecon"
Repository = "https://github.com/kaizhengnz/ScreenRecon"
Issues = "https://github.com/kaizhengnz/ScreenRecon/issues"

[tool.hatch.version]
path = "src/screenrecon/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/screenrecon"]

[tool.hatch.build.targets.sdist]
exclude = [".github", "scripts", ".repoql", "*.tmp.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",   # function call in default argument - not used here
    "SIM105", # contextlib.suppress is not clearer for the tiny ignore blocks
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
